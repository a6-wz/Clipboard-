<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحافظة السحابية الذكية</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Cairo & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#000000',
                        cardbg: '#09090b',
                        bordercolor: '#27272a'
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000000;
            color: #f4f4f5;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .liquid-glass {
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen">

    <div id="app" class="max-w-4xl mx-auto px-4 py-6 flex flex-col min-h-screen">
        
        <!-- App Header with Explicit Login Button -->
        <header class="flex items-center justify-between gap-4 mb-6 pb-4 border-b border-zinc-800/80">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-cloud text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">الحافظة السحابية الذكية</h1>
                    <p class="text-xs text-zinc-400">حفظ ومزامنة فورية بين جميع أجهزتك</p>
                </div>
            </div>

            <!-- Login / User Profile Button Section -->
            <div id="userAuthSection" class="flex items-center gap-2">
                <button id="openAuthModalBtn" class="px-4 py-2 rounded-xl bg-white hover:bg-zinc-200 text-black text-xs font-bold transition-all flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </div>
        </header>

        <!-- New Clip Form -->
        <div class="p-4 md:p-5 rounded-2xl bg-zinc-950 border border-zinc-800/80 mb-6">
            
            <!-- Type Selector Tabs (Explicit selection - No Auto Detect) -->
            <div class="flex items-center gap-1.5 mb-3 overflow-x-auto pb-1 scrollbar-none border-b border-zinc-800/60">
                <button type="button" class="type-tab-btn active-tab px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-zinc-800 text-white flex items-center gap-1.5 whitespace-nowrap" data-type="text">
                    <i class="fa-solid fa-font text-xs"></i> نص / رابط
                </button>
                <button type="button" class="type-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-zinc-400 hover:text-white hover:bg-zinc-900 flex items-center gap-1.5 whitespace-nowrap" data-type="code">
                    <i class="fa-solid fa-code text-xs"></i> كود برمجي
                </button>
                <button type="button" class="type-tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all text-zinc-400 hover:text-white hover:bg-zinc-900 flex items-center gap-1.5 whitespace-nowrap" data-type="note">
                    <i class="fa-solid fa-sticky-note text-xs"></i> ملاحظة
                </button>
            </div>

            <!-- Code Language Selector (Appears only when "code" is selected) -->
            <div id="langSelectContainer" class="hidden mb-3">
                <label class="text-xs text-zinc-400 mb-1 block">اختر لغة البرمجة:</label>
                <select id="codeLanguageSelect" class="w-full text-xs bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-xl px-3 py-2 outline-none">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="php">PHP</option>
                    <option value="sql">SQL</option>
                    <option value="json">JSON</option>
                    <option value="java">Java</option>
                    <option value="csharp">C#</option>
                </select>
            </div>

            <!-- Main Input Textarea -->
            <div class="relative">
                <textarea id="clipInput" rows="3" placeholder="أدخل النص، الرابط، أو الكود هنا..." class="w-full p-3.5 rounded-xl bg-zinc-900/80 border border-zinc-800 focus:border-zinc-500 outline-none text-zinc-100 text-sm resize-y font-sans transition-all placeholder:text-zinc-500"></textarea>
            </div>

            <!-- Additional Controls -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mt-3">
                <div class="flex flex-wrap items-center gap-2">
                    <input id="tagInput" type="text" placeholder="وسم (مثال: عمل, شخصي)" class="text-xs bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-xl px-3 py-1.5 outline-none w-36 placeholder:text-zinc-500">
                    
                    <label class="flex items-center gap-1.5 text-xs text-zinc-400 cursor-pointer bg-zinc-900 px-2.5 py-1.5 rounded-xl border border-zinc-800">
                        <input type="checkbox" id="pinLockToggle" class="rounded bg-zinc-800 border-zinc-700 text-white focus:ring-0">
                        <span>قفل بـ PIN</span>
                    </label>
                    <input id="pinInput" type="password" maxlength="4" placeholder="رمز PIN" class="hidden text-xs bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-xl px-2.5 py-1.5 outline-none w-20 text-center">
                </div>

                <div class="flex items-center gap-2 justify-end">
                    <button id="quickPasteBtn" type="button" class="px-3 py-2 rounded-xl text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 transition-all flex items-center gap-1">
                        <i class="fa-solid fa-paste"></i> لصق
                    </button>
                    <button id="addClipBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-bold bg-white hover:bg-zinc-200 text-black shadow-md transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i>
                        <span>إضافة للحافظة</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-5">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                <input id="searchInput" type="text" placeholder="ابحث في حافظتك..." class="w-full pr-9 pl-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-zinc-200 outline-none focus:border-zinc-600 transition-all">
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
                <button class="filter-btn active-filter px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-white text-black" data-filter="all">الكل</button>
                <button class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-zinc-950 border border-zinc-800 text-zinc-400 hover:text-white" data-filter="pinned">المثبتة ⭐</button>
                <button class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-zinc-950 border border-zinc-800 text-zinc-400 hover:text-white" data-filter="code">الأكواد 💻</button>
                <button class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-zinc-950 border border-zinc-800 text-zinc-400 hover:text-white" data-filter="text">النصوص 📝</button>
            </div>
        </div>

        <!-- Clips Grid -->
        <div id="clipsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 flex-1 align-start">
            <!-- Items rendered via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
            <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-500 text-xl mb-3">
                <i class="fa-solid fa-inbox"></i>
            </div>
            <h3 class="text-sm font-bold text-zinc-300">لا توجد عناصر محفوظة</h3>
            <p class="text-xs text-zinc-500 mt-1">أضف نصوصك وأكوادك هنا لمزامنتها مباشرة</p>
        </div>
    </div>

    <!-- Authentication Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl relative">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-lock text-zinc-400"></i>
                    تسجيل الدخول للمزامنة
                </h3>
                <button id="closeAuthModalBtn" class="text-zinc-500 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <p class="text-xs text-zinc-400 mb-4">قم بتسجيل الدخول لتتمكن من الوصول إلى حافظتك من أي مكان بآمان.</p>

            <button id="googleSignInBtn" class="w-full py-2.5 px-4 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white text-xs font-bold transition-all flex items-center justify-center gap-2 mb-3">
                <i class="fa-brands fa-google text-red-500"></i>
                <span>متابعة باستخدام Google</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-zinc-800"></div>
                <span class="flex-shrink mx-2 text-[10px] text-zinc-500">أو بريد إلكتروني</span>
                <div class="flex-grow border-t border-zinc-800"></div>
            </div>

            <form id="emailLoginForm" class="space-y-3 mt-2">
                <input id="loginEmail" type="email" required placeholder="البريد الإلكتروني" class="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-100 outline-none focus:border-zinc-600">
                <input id="loginPassword" type="password" required placeholder="كلمة المرور" class="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-zinc-100 outline-none focus:border-zinc-600">
                <button type="submit" class="w-full py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black text-xs font-bold transition-all">
                    تسجيل الدخول / إنشاء حساب
                </button>
            </form>
        </div>
    </div>

    <!-- Share / QR Modal -->
    <div id="shareModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-qrcode text-zinc-400"></i> رمز QR للمشاركة
                </h3>
                <button id="closeShareModalBtn" class="text-zinc-500 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex flex-col items-center p-3 bg-black rounded-xl border border-zinc-800">
                <img id="qrImage" src="" alt="QR" class="w-40 h-40 rounded-lg p-2 bg-white">
                <p id="qrTextPreview" class="text-[11px] text-zinc-400 mt-2 line-clamp-2 break-all text-center"></p>
            </div>
        </div>
    </div>

    <!-- PIN Unlock Modal -->
    <div id="pinUnlockModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 max-w-xs w-full text-center">
            <i class="fa-solid fa-lock text-2xl text-zinc-400 mb-2"></i>
            <h3 class="text-sm font-bold text-white mb-1">فك قفل المحتوى</h3>
            <p class="text-xs text-zinc-500 mb-3">أدخل رمز PIN المكون من 4 أرقام</p>
            <input id="unlockPinInput" type="password" maxlength="4" class="w-full p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-center text-lg tracking-widest text-white outline-none mb-3">
            <div class="flex gap-2">
                <button id="cancelUnlockBtn" class="flex-1 py-2 rounded-xl bg-zinc-900 text-zinc-400 text-xs font-bold">إلغاء</button>
                <button id="confirmUnlockBtn" class="flex-1 py-2 rounded-xl bg-white text-black text-xs font-bold">فك القفل</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Firebase Configuration fallback object
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForFallbackPurpose12345",
            authDomain: "ayman-44297.firebaseapp.com",
            projectId: "ayman-44297",
            storageBucket: "ayman-44297.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // Initialize Firebase safely
        let auth, db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            console.log("Firebase fallback mode active");
        }

        // Global State
        let clips = JSON.parse(localStorage.getItem('smart_cloud_clips_v2')) || [
            {
                id: '1',
                content: 'https://github.com/cloud-clipboard',
                type: 'text',
                tag: 'رابط',
                pinned: true,
                pin: '',
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                content: 'function helloWorld() {\n  console.log("مرحباً بك!");\n}',
                type: 'code',
                language: 'javascript',
                tag: 'برمجة',
                pinned: false,
                pin: '',
                createdAt: new Date().toISOString()
            }
        ];

        let selectedType = 'text';
        let currentFilter = 'all';
        let searchQuery = '';
        let targetClipForUnlock = null;

        // UI Elements
        const clipInput = document.getElementById('clipInput');
        const tagInput = document.getElementById('tagInput');
        const pinLockToggle = document.getElementById('pinLockToggle');
        const pinInput = document.getElementById('pinInput');
        const addClipBtn = document.getElementById('addClipBtn');
        const quickPasteBtn = document.getElementById('quickPasteBtn');
        const searchInput = document.getElementById('searchInput');
        const clipsGrid = document.getElementById('clipsGrid');
        const emptyState = document.getElementById('emptyState');
        const langSelectContainer = document.getElementById('langSelectContainer');
        const codeLanguageSelect = document.getElementById('codeLanguageSelect');
        const userAuthSection = document.getElementById('userAuthSection');
        const authModal = document.getElementById('authModal');
        const openAuthModalBtn = document.getElementById('openAuthModalBtn');
        const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const emailLoginForm = document.getElementById('emailLoginForm');

        // Pin Toggle behavior
        pinLockToggle.addEventListener('change', () => {
            if (pinLockToggle.checked) {
                pinInput.classList.remove('hidden');
                pinInput.focus();
            } else {
                pinInput.classList.add('hidden');
                pinInput.value = '';
            }
        });

        // Type selection tabs (Explicit type choices)
        document.querySelectorAll('.type-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-tab-btn').forEach(b => {
                    b.classList.remove('active-tab', 'bg-zinc-800', 'text-white');
                    b.classList.add('text-zinc-400');
                });
                btn.classList.add('active-tab', 'bg-zinc-800', 'text-white');
                btn.classList.remove('text-zinc-400');

                selectedType = btn.dataset.type;
                
                if (selectedType === 'code') {
                    langSelectContainer.classList.remove('hidden');
                } else {
                    langSelectContainer.classList.add('hidden');
                }
            });
        });

        // Add new Clip
        addClipBtn.addEventListener('click', () => {
            const content = clipInput.value.trim();
            if (!content) {
                showToast('يرجى إدخال محتوى أولاً', 'warning');
                return;
            }

            let pinCode = '';
            if (pinLockToggle.checked) {
                pinCode = pinInput.value.trim();
                if (pinCode.length < 4) {
                    showToast('يرجى كتابة رمز PIN مكون من 4 أرقام', 'warning');
                    return;
                }
            }

            const newClip = {
                id: Date.now().toString(),
                content: content,
                type: selectedType,
                language: selectedType === 'code' ? codeLanguageSelect.value : '',
                tag: tagInput.value.trim() || 'عام',
                pinned: false,
                pin: pinCode,
                createdAt: new Date().toISOString()
            };

            clips.unshift(newClip);
            saveToStorage();
            renderClips();

            // Reset Input
            clipInput.value = '';
            tagInput.value = '';
            pinInput.value = '';
            pinLockToggle.checked = false;
            pinInput.classList.add('hidden');

            showToast('تمت إضافة العنصر للحافظة بنجاح', 'success');
        });

        // Quick Paste
        quickPasteBtn.addEventListener('click', async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    clipInput.value = text;
                    showToast('تم اللصق من الحافظة', 'info');
                }
            } catch (err) {
                showToast('الرجاء السماح بالوصول للحافظة', 'warning');
            }
        });

        // Fallback Clipboard Copy
        function copyText(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (e) {
                success = false;
            }
            document.body.removeChild(ta);
            return success;
        }

        window.handleCopy = function(id) {
            const clip = clips.find(c => c.id === id);
            if (!clip) return;

            if (clip.pin) {
                promptPinUnlock(clip, (unlockedClip) => {
                    copyText(unlockedClip.content);
                    showToast('تم نسخ المحتوى المشفّر بنجاح', 'success');
                });
                return;
            }

            copyText(clip.content);
            showToast('تم نسخ المحتوى للحافظة', 'success');
        };

        window.togglePin = function(id) {
            const clip = clips.find(c => c.id === id);
            if (clip) {
                clip.pinned = !clip.pinned;
                saveToStorage();
                renderClips();
            }
        };

        window.deleteClip = function(id) {
            clips = clips.filter(c => c.id !== id);
            saveToStorage();
            renderClips();
            showToast('تم حذف العنصر', 'info');
        };

        // PIN Unlock Handler
        function promptPinUnlock(clip, callback) {
            targetClipForUnlock = { clip, callback };
            document.getElementById('unlockPinInput').value = '';
            document.getElementById('pinUnlockModal').classList.remove('hidden');
            document.getElementById('pinUnlockModal').classList.add('flex');
            document.getElementById('unlockPinInput').focus();
        }

        document.getElementById('cancelUnlockBtn').addEventListener('click', () => {
            document.getElementById('pinUnlockModal').classList.add('hidden');
            document.getElementById('pinUnlockModal').classList.remove('flex');
        });

        document.getElementById('confirmUnlockBtn').addEventListener('click', () => {
            const entered = document.getElementById('unlockPinInput').value;
            if (targetClipForUnlock && entered === targetClipForUnlock.clip.pin) {
                document.getElementById('pinUnlockModal').classList.add('hidden');
                document.getElementById('pinUnlockModal').classList.remove('flex');
                targetClipForUnlock.callback(targetClipForUnlock.clip);
            } else {
                showToast('رمز PIN غير صحيح', 'error');
            }
        });

        // Share QR Modal
        window.openShare = function(id) {
            const clip = clips.find(c => c.id === id);
            if (!clip) return;

            const modal = document.getElementById('shareModal');
            const qrImg = document.getElementById('qrImage');
            const preview = document.getElementById('qrTextPreview');

            const content = clip.pin ? 'محتوى محمي برقم سري' : clip.content;
            preview.textContent = content;
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(content.substring(0, 200))}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        document.getElementById('closeShareModalBtn').addEventListener('click', () => {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
        });

        // Auth Modal Handlers
        openAuthModalBtn.addEventListener('click', () => {
            authModal.classList.remove('hidden');
            authModal.classList.add('flex');
        });

        closeAuthModalBtn.addEventListener('click', () => {
            authModal.classList.add('hidden');
            authModal.classList.remove('flex');
        });

        googleSignInBtn.addEventListener('click', () => {
            if (auth) {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(() => {
                    authModal.classList.add('hidden');
                    showToast('تم تسجيل الدخول بنجاح', 'success');
                }).catch(err => {
                    showToast('تعذر تسجيل الدخول: ' + err.message, 'error');
                });
            } else {
                showToast('تم تفعيل وضع الدخول التجريبي', 'info');
                updateUserUI({ displayName: 'مستخدم تجريبي', email: 'user@example.com' });
                authModal.classList.add('hidden');
            }
        });

        emailLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            showToast('تم تسجيل الدخول: ' + email, 'success');
            updateUserUI({ displayName: email.split('@')[0], email: email });
            authModal.classList.add('hidden');
        });

        function updateUserUI(user) {
            if (user) {
                userAuthSection.innerHTML = `
                    <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl text-xs">
                        <i class="fa-solid fa-circle-user text-zinc-400"></i>
                        <span class="text-zinc-200 font-bold">${user.displayName || user.email}</span>
                        <button onclick="logoutUser()" title="تسجيل الخروج" class="text-zinc-500 hover:text-red-400 mr-1">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            } else {
                userAuthSection.innerHTML = `
                    <button id="openAuthModalBtn" onclick="document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex');" class="px-4 py-2 rounded-xl bg-white hover:bg-zinc-200 text-black text-xs font-bold transition-all flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>تسجيل الدخول</span>
                    </button>
                `;
            }
        }

        window.logoutUser = function() {
            if (auth) auth.signOut();
            updateUserUI(null);
            showToast('تم تسجيل الخروج', 'info');
        };

        // Filter & Search listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active-filter', 'bg-white', 'text-black');
                    b.classList.add('bg-zinc-950', 'text-zinc-400');
                });
                btn.classList.add('active-filter', 'bg-white', 'text-black');
                btn.classList.remove('bg-zinc-950', 'text-zinc-400');

                currentFilter = btn.dataset.filter;
                renderClips();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderClips();
        });

        function renderClips() {
            clipsGrid.innerHTML = '';

            let filtered = clips.filter(clip => {
                if (currentFilter === 'pinned' && !clip.pinned) return false;
                if (currentFilter === 'code' && clip.type !== 'code') return false;
                if (currentFilter === 'text' && clip.type !== 'text' && clip.type !== 'note') return false;

                if (searchQuery) {
                    return clip.content.toLowerCase().includes(searchQuery) || (clip.tag && clip.tag.toLowerCase().includes(searchQuery));
                }
                return true;
            });

            filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            filtered.forEach(clip => {
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl bg-zinc-950 border ${clip.pinned ? 'border-amber-500/50' : 'border-zinc-800'} flex flex-col justify-between`;

                let bodyHtml = '';
                if (clip.pin) {
                    bodyHtml = `
                        <div class="py-4 text-center text-zinc-500 text-xs flex flex-col items-center gap-1">
                            <i class="fa-solid fa-lock text-base text-zinc-400"></i>
                            <span>محتوى مقفل برقم PIN</span>
                        </div>
                    `;
                } else if (clip.type === 'code') {
                    bodyHtml = `<pre class="bg-black text-zinc-200 p-3 rounded-lg text-xs font-mono overflow-x-auto text-left dir-ltr border border-zinc-900 max-h-36"><code>${escapeHtml(clip.content)}</code></pre>`;
                } else {
                    bodyHtml = `<p class="text-xs text-zinc-300 whitespace-pre-wrap break-words line-clamp-4 leading-relaxed">${escapeHtml(clip.content)}</p>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 text-[10px] border border-zinc-800">#${escapeHtml(clip.tag)}</span>
                                ${clip.language ? `<span class="px-1.5 py-0.5 rounded bg-zinc-900 text-xs font-mono text-zinc-500">${clip.language}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="togglePin('${clip.id}')" title="تثبيت" class="p-1 rounded hover:bg-zinc-900 ${clip.pinned ? 'text-amber-400' : 'text-zinc-600'} text-xs">
                                    <i class="fa-solid fa-thumbtack"></i>
                                </button>
                                <button onclick="openShare('${clip.id}')" title="مشاركة" class="p-1 rounded text-zinc-600 hover:text-white hover:bg-zinc-900 text-xs">
                                    <i class="fa-solid fa-qrcode"></i>
                                </button>
                                <button onclick="deleteClip('${clip.id}')" title="حذف" class="p-1 rounded text-zinc-600 hover:text-red-400 hover:bg-zinc-900 text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="my-2">${bodyHtml}</div>
                    </div>
                    <div class="mt-3 pt-2 border-t border-zinc-900 flex items-center justify-between text-[10px] text-zinc-500">
                        <span>${new Date(clip.createdAt).toLocaleDateString('ar-EG')}</span>
                        <button onclick="handleCopy('${clip.id}')" class="px-3 py-1 rounded-lg bg-zinc-900 hover:bg-white hover:text-black text-zinc-300 font-bold transition-all text-xs flex items-center gap-1">
                            <i class="fa-solid fa-copy"></i> نسخ
                        </button>
                    </div>
                `;

                clipsGrid.appendChild(card);
            });

            // Highlight syntax
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-3.5 py-2 rounded-xl text-xs font-bold text-white shadow-lg bg-zinc-900 border border-zinc-800 animate-in slide-in-from-bottom-2 duration-200`;
            toast.innerHTML = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function saveToStorage() {
            localStorage.setItem('smart_cloud_clips_v2', JSON.stringify(clips));
        }

        // Firebase Auth State Listener
        if (auth) {
            auth.onAuthStateChanged(user => {
                updateUserUI(user);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderClips();
        });
    </script>
</body>
</html>
